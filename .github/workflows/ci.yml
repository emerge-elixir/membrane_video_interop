name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --force --warnings-as-errors
      - run: mix test --warnings-as-errors

  minimum-dependencies:
    name: Minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: Select minimum supported dependencies
        run: |
          sed -i 's/{:membrane_core, "~> 1.2"}/{:membrane_core, "== 1.2.0"}/' mix.exs
          sed -i 's/{:membrane_raw_video_format, "~> 0.4"}/{:membrane_raw_video_format, "== 0.4.0"}/' mix.exs
          grep -Fq '{:membrane_core, "== 1.2.0"}' mix.exs
          grep -Fq '{:membrane_raw_video_format, "== 0.4.0"}' mix.exs
          rm mix.lock
      - run: mix deps.get
      - run: mix compile --force --warnings-as-errors
      - run: mix test --warnings-as-errors

  docs-and-package:
    name: Documentation and Hex package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - run: mix deps.get
      - run: mix compile --force --warnings-as-errors
      - run: mix docs --warnings-as-errors
      - run: mix hex.audit
      - name: Build and compile the unpacked package
        run: |
          package_dir="$RUNNER_TEMP/membrane_video_interop-0.1.0"
          mix hex.build --unpack --output "$package_dir"
          (
            cd "$package_dir"
            MIX_ENV=prod mix deps.get
            MIX_ENV=prod mix compile --force --warnings-as-errors
          )

  release-tag:
    name: Release tag
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, minimum-dependencies, docs-and-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag, package version, and changelog date
        run: |
          version="$(sed -n 's/^  @version "\([^"]*\)"/\1/p' mix.exs)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -Eq "^## $version - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md

  publish-hex:
    name: Publish membrane_video_interop to Hex
    if: github.repository == 'emerge-elixir/membrane_video_interop' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hex
    concurrency:
      group: hex-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - name: Cache Mix dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Install dependencies
        run: mix deps.get
      - name: Verify tag matches Mix version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(mix run --no-compile --no-start -e 'IO.write(Mix.Project.config()[:version])')"
          test "$tag_version" = "$project_version"
      - name: Build documentation
        run: mix docs --warnings-as-errors
      - name: Verify Hex package contents
        run: mix hex.build --unpack --output "$RUNNER_TEMP/membrane_video_interop-0.1.0"
      - name: Publish tagged Hex package
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish package --yes
      - name: Publish tagged Hex documentation
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes
